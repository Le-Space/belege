name: Bridge image

# The hosted bridge's image for an Aleph confidential VM (#583): Debian with
# Node, Caddy, relay-button's attest relay and the bridge from this checkout
# baked in (bridge/rootfs/build-image.sh), made confidential and encrypted by
# relay-button's aleph-confidential-rootfs action, and published as an Aleph
# STORE (paid in credits by ALEPH_PRIVATE_KEY). Made as
# Le-Space/paperless-anywhere's "Paperless rootfs" workflow makes its image.
#
# bridge-image.json (an artifact, and a release asset when run for a tag)
# names what an instance boots from and what it was made of: the STORE hash,
# the sha256 of the plain image, and the pinned inputs. The launch
# measurement is computed from Aleph's SEV-SNP runtime and the owner's
# address (bridge/rootfs/README.md), so it is the same for every image.
#
# With "plain", the job also publishes the image without encryption, as a
# STORE of its own, and records its SHA-256 (#777). It is the image after the
# confidential conversion and before the encryption: what an image builder
# seals for one set of books, and what anyone can download and hash. It holds
# no secret: no key, no passphrase, no account.
#
# Secrets: ALEPH_PRIVATE_KEY (pays the STOREs), BRIDGE_LUKS_PASSPHRASE (the disk key).

on:
  # A pull request that changes the image builds and converts it, unencrypted
  # and unpublished.
  pull_request:
    paths:
      - 'bridge/rootfs/**'
      - '.github/workflows/bridge-image.yml'
      - '.github/publish-store/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Encrypt and publish on Aleph (costs credits); off builds the plain image only
        type: boolean
        default: true
      plain:
        description: Also publish the image without encryption and record its SHA-256 (for an image of one's own, #777). Costs the storage of a second, smaller file.
        type: boolean
        default: false

permissions:
  contents: write
  # For the provenance of the plain image: GitHub signs "this file was built
  # by this workflow at this commit".
  id-token: write
  attestations: write

concurrency:
  group: bridge-image
  cancel-in-progress: false

env:
  # relay-button v0.12.4: the confidential conversion and the attest relay.
  RELAY_BUTTON_COMMIT: f05e14bfbbd42b75dd06e5e87dab57d09deff283

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Check the secrets
        if: inputs.publish || inputs.plain
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          LUKS: ${{ secrets.BRIDGE_LUKS_PASSPHRASE }}
          ENCRYPT: ${{ inputs.publish }}
        run: |
          [ -n "$ALEPH_PRIVATE_KEY" ] || { echo "::error::set the ALEPH_PRIVATE_KEY secret"; exit 1; }
          [ "$ENCRYPT" != true ] || [ -n "$LUKS" ] || { echo "::error::set the BRIDGE_LUKS_PASSPHRASE secret"; exit 1; }

      - name: Shell
        run: shellcheck -S warning bridge/rootfs/build-image.sh bridge/rootfs/deploy-bridge.sh bridge/rootfs/files/belege-bridge-*[!e]

      - name: The bridge, production dependencies only
        run: |
          ./bridge/rootfs/deploy-bridge.sh "$RUNNER_TEMP/bridge"

      - name: The attest relay, one file
        run: |
          git clone -q https://github.com/NiKrause/relay-button.git "$RUNNER_TEMP/relay-button"
          git -C "$RUNNER_TEMP/relay-button" checkout -q "$RELAY_BUTTON_COMMIT"
          cd "$RUNNER_TEMP/relay-button/packages/attest-relay"
          npm install --no-package-lock --no-audit --no-fund --loglevel=error
          node scripts/bundle.mjs "$RUNNER_TEMP/attest-relay.cjs"
          ls -l "$RUNNER_TEMP/attest-relay.cjs"

      - name: Build the plain image
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq debootstrap debian-archive-keyring >/dev/null
          start=$(date +%s)
          sudo ./bridge/rootfs/build-image.sh "$RUNNER_TEMP/bridge.ext4" "$RUNNER_TEMP/bridge" "$RUNNER_TEMP/attest-relay.cjs"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/bridge.ext4"
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "PLAIN_BYTES=$(stat -c %s "$RUNNER_TEMP/bridge.ext4")" >> "$GITHUB_ENV"
          echo "PLAIN_SHA256=$(sha256sum "$RUNNER_TEMP/bridge.ext4" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # The same conversion the action below runs (the same script at the same
      # commit), kept this time: the action removes its plain copy. A pull
      # request runs it too, without publishing, so the size and the limit
      # are known before a run that costs.
      - name: Convert the plain image
        id: plain
        if: inputs.plain || github.event_name == 'pull_request'
        env:
          # What Le-Space/paperless-anywhere's image builder takes: Aleph's
          # 1 GiB upload, less the 32 MiB the encryption adds.
          MAX_BYTES: 1040187392
        run: |
          sudo apt-get install -y -qq e2fsprogs jq qemu-utils rsync >/dev/null
          plain="$RUNNER_TEMP/bridge-plain.ext4"
          printf '%s\n' '# no key in the image: a test sends its own with the unlock' > "$RUNNER_TEMP/plain-authorized_keys"
          sudo MAX_PLAIN_MIB=3500 "$RUNNER_TEMP/relay-button/packages/rootfs/reference/confidential/make-confidential-rootfs.sh" \
            "$RUNNER_TEMP/bridge.ext4" "$plain" "$RUNNER_TEMP/plain-authorized_keys"
          sudo chown "$(id -u):$(id -g)" "$plain"
          bytes="$(stat -c %s "$plain")"
          [ "$bytes" -le "$MAX_BYTES" ] || { echo "::error::the plain image has $bytes bytes; an image builder takes at most $MAX_BYTES"; exit 1; }
          # Stored gzipped. The SHA-256 stays that of the image itself: a
          # builder unpacks it and checks what it unpacked.
          gzip -6 -c "$plain" > "$plain.gz"
          {
            echo "sha256=$(sha256sum "$plain" | cut -d' ' -f1)"
            echo "bytes=$bytes"
            echo "stored_bytes=$(stat -c %s "$plain.gz")"
          } >> "$GITHUB_OUTPUT"
          rm -f "$plain"

      - name: Publish the plain image
        id: plain_store
        if: inputs.plain
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          ALEPH_API: https://api2.aleph.im
          CHANNEL: ALEPH-CLOUDSOLUTIONS
        run: |
          dir="$RUNNER_TEMP/plain-store"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/relay-button/.github/actions/aleph-confidential-rootfs/publish-store.mjs" "$dir/"
          # The exact packages of the lockfile, and none of their install
          # scripts: this step holds the key that signs and pays.
          cp .github/publish-store/package.json .github/publish-store/package-lock.json "$dir/"
          cd "$dir"
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error >/dev/null
          # A failed upload stores nothing, so trying again repeats nothing.
          for try in 1 2 3; do
            node publish-store.mjs "$RUNNER_TEMP/bridge-plain.ext4.gz" > store.json && break
            [ "$try" = 3 ] && { echo "::error::Aleph did not take the plain image in three tries"; exit 1; }
            echo "upload $try failed; trying again in a minute"
            sleep 60
          done
          store="$(jq -r .item_hash store.json)"
          [[ "$store" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no STORE hash for the plain image"; exit 1; }
          echo "store=$store" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            status="$(curl -fsS "$ALEPH_API/api/v0/messages/$store" | jq -r .status || true)"
            echo "[$i] STORE $store: $status"
            [ "$status" = processed ] && exit 0
            [ "$status" = rejected ] && { echo "::error::the STORE of the plain image was rejected"; exit 1; }
            sleep 20
          done
          echo "::error::the STORE of the plain image was not processed within 20 minutes"; exit 1

      # `gh attestation verify bridge-plain.ext4 --repo Le-Space/belege` checks it.
      - name: Provenance of the plain image
        id: provenance
        if: inputs.plain && steps.plain.outputs.sha256
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: bridge-plain.ext4
          subject-digest: sha256:${{ steps.plain.outputs.sha256 }}

      - name: Confidential, encrypted, published
        id: rootfs
        if: inputs.publish
        uses: NiKrause/relay-button/.github/actions/aleph-confidential-rootfs@f05e14bfbbd42b75dd06e5e87dab57d09deff283 # v0.12.4
        with:
          image_path: ${{ runner.temp }}/bridge.ext4
          # No key in the image: a test sends its own with the unlock; the app never does.
          ssh_public_key: '# no key in the image: a test sends its own with the unlock'
          luks_passphrase: ${{ secrets.BRIDGE_LUKS_PASSPHRASE }}
          aleph_private_key: ${{ secrets.ALEPH_PRIVATE_KEY }}

      - name: bridge-image.json
        env:
          STORE: ${{ steps.rootfs.outputs.rootfs_item_hash }}
          SIZE_MIB: ${{ steps.rootfs.outputs.rootfs_size_mib }}
          SEALABLE_STORE: ${{ steps.plain_store.outputs.store }}
          SEALABLE_SHA256: ${{ steps.plain.outputs.sha256 }}
          SEALABLE_BYTES: ${{ steps.plain.outputs.bytes }}
          SEALABLE_STORED_BYTES: ${{ steps.plain.outputs.stored_bytes }}
          PROVENANCE: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          node --input-type=module > "$RUNNER_TEMP/bridge-image.json" <<'EOF'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('bridge/package.json', 'utf8'))
          const build = readFileSync('bridge/rootfs/build-image.sh', 'utf8')
          const pin = (name) => (new RegExp(`^${name}=(\\S+)`, 'm').exec(build) ?? [])[1] ?? null
          console.log(JSON.stringify({
            schema: 1,
            bridge: pkg.version,
            commit: process.env.GITHUB_SHA,
            store: process.env.STORE || null,
            plain: { sha256: process.env.PLAIN_SHA256, bytes: Number(process.env.PLAIN_BYTES) },
            encryptedMiB: process.env.SIZE_MIB ? Number(process.env.SIZE_MIB) : null,
            // The image as it is sealed: after the confidential conversion,
            // before the encryption. `store` holds it gzipped; `sha256` and
            // `bytes` are those of the image itself. null unless run with "plain".
            sealable: process.env.SEALABLE_STORE
              ? {
                  store: process.env.SEALABLE_STORE,
                  sha256: process.env.SEALABLE_SHA256,
                  bytes: Number(process.env.SEALABLE_BYTES),
                  storedBytes: Number(process.env.SEALABLE_STORED_BYTES),
                  provenance: process.env.PROVENANCE || null
                }
              : null,
            inputs: {
              debian: 'bookworm',
              node: pin('NODE_VERSION'),
              nodeSha256: pin('NODE_SHA256'),
              relayButton: process.env.RELAY_BUTTON_COMMIT
            },
            measurement: 'Aleph SEV-SNP runtime and the owner address (@le-space/attest-wasm confidentialTrustedExecution); see bridge/rootfs/README.md'
          }, null, 2))
          EOF
          cat "$RUNNER_TEMP/bridge-image.json"
          {
            echo "## Bridge image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Encrypted rootfs (STORE) | \`${STORE:-not published}\` |"
            echo "| Plain image | $(( ${PLAIN_BYTES:-0} / 1048576 )) MiB, sha256 \`${PLAIN_SHA256}\`, built in ${BUILD_SECONDS:-?} s |"
            echo "| Encrypted image | ${SIZE_MIB:-–} MiB |"
            echo "| Built from | commit \`${GITHUB_SHA}\` |"
            if [ -n "$SEALABLE_SHA256" ]; then
              echo
              echo "### Plain image, as it is sealed"
              echo
              echo "After the confidential conversion, before the encryption. Public and without a secret; anyone can download it and compare the hash."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Plain image (STORE) | \`${SEALABLE_STORE:-not published}\` |"
              echo "| SHA-256 (of the image, unpacked) | \`${SEALABLE_SHA256}\` |"
              echo "| Size | $(( ${SEALABLE_BYTES:-0} / 1048576 )) MiB; gzipped $(( ${SEALABLE_STORED_BYTES:-0} / 1048576 )) MiB |"
              echo "| Provenance | ${PROVENANCE:-none} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-image
          path: ${{ runner.temp }}/bridge-image.json

      - name: Attach to the release
        if: (inputs.publish || inputs.plain) && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/bridge-image.json" --clobber
