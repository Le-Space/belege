name: Package tests

# The open building blocks under packages/ (#264), each with its own tests
# and format check. The @le-space/* packages (Le-Space/eigenbeleg-agent#6)
# also run a scenario in Chromium and compare it with Node
# (packages/browser-test): a Node-only import or Buffer fails them. A pull
# request tests the packages it changes and the packages that depend on
# them (pnpm's `...[since]` filter); a push to main, a release (ci.yml) and
# a run by hand test every package. Where @le-space/eigenbeleg is among them,
# veraPDF checks one of each document it draws (on @le-space/pdf) against
# PDF/A-2b. The bridge and the app, which use the packages, have their own
# workflows.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ci.yml calls this for a release and a deploy.
  workflow_call:

concurrency:
  group: packages-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # A pull request's checkout is its merge commit: HEAD^1 is the base.
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Which packages
        id: which
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo 'filter=...[HEAD^1]' >> "$GITHUB_OUTPUT"
          else
            echo 'filter=./packages/*' >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: pnpm install --frozen-lockfile --filter "./packages/*..."
      # The headless shell is enough for the scenarios; CI set makes a missing
      # browser fail the tests instead of skipping them.
      - name: Chromium for the browser scenarios
        timeout-minutes: 10
        run: |
          for try in 1 2 3; do
            timeout 180 pnpm --filter @le-space/browser-test exec playwright install --only-shell chromium && exit 0
            echo "Chromium download try $try did not finish; trying again"
          done
          exit 1
      # Only the packages: the root, the bridge (with its launcher) and the app
      # have workflows of their own, and the dependents' filter would pick them too.
      - name: Format
        env:
          FILTER: ${{ steps.which.outputs.filter }}
        run: pnpm --filter "$FILTER" --filter '!belege' --filter '!@belege/bridge' --filter '!@belege/bridge-launcher' --filter '!@belege/app' --if-present run lint
      - name: Tests
        env:
          FILTER: ${{ steps.which.outputs.filter }}
        run: pnpm --filter "$FILTER" --filter '!belege' --filter '!@belege/bridge' --filter '!@belege/bridge-launcher' --filter '!@belege/app' --if-present run test
      # PDF/A-2b: one of each document @le-space/eigenbeleg draws, from made-up
      # data (packages/eigenbeleg/scripts/pdfa-samples.js), through veraPDF.
      # Its image pinned by digest; a document that is not PDF/A-2b fails.
      - name: PDF/A (veraPDF)
        timeout-minutes: 5
        env:
          FILTER: ${{ steps.which.outputs.filter }}
          VERAPDF: verapdf/cli:v1.30.3@sha256:d74b7026c18a0f171e73c153b617fe6520e1511feb24ca98a348b2bb897669fb
        run: |
          if ! pnpm --filter "$FILTER" ls --depth -1 --json | grep -q '"name": "@le-space/eigenbeleg"'; then
            echo "@le-space/eigenbeleg is not in this run: no PDF/A to check"
            exit 0
          fi
          out="$RUNNER_TEMP/pdfa"
          pnpm --filter @le-space/eigenbeleg run pdfa-samples "$out"
          docker run --rm -v "$out:/data:ro" "$VERAPDF" --flavour 2b --format text /data/
