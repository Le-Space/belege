name: Publish a package

# Publishes one of the shared @le-space/* packages under packages/ to npm
# (Le-Space/eigenbeleg-agent#6), by hand only: its tests (Node and
# Chromium) first, then `pnpm pack` (it writes the version of a
# `workspace:^` dependency into the packed package.json) and `npm publish`
# of that tarball through npm's trusted publishing: npm checks this
# workflow's OIDC identity (repository, `packages-publish.yml`, environment
# `npm`) instead of a token, and signs the provenance statement itself.
# Each package on npmjs.com names this workflow as its trusted publisher.
# Approve a package on npmjs.com after the ones it depends on, so nobody can
# install it before them: ledger → rates → chains → pdf → eigenbeleg.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      package:
        description: The package to publish
        required: true
        type: choice
        options: [ledger, rates, chains, pdf, eigenbeleg]

# One queue per package: GitHub keeps only one pending run per group, so a
# shared group dropped a package that was started while another one ran.
concurrency:
  group: packages-publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @le-space/${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      # Trusted publishing and the provenance statement use the workflow's
      # OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile --filter "./packages/*..."
      - name: Chromium for the browser scenarios
        timeout-minutes: 10
        run: |
          for try in 1 2 3; do
            timeout 180 pnpm --filter @le-space/browser-test exec playwright install --only-shell chromium && exit 0
            echo "Chromium download try $try did not finish; trying again"
          done
          exit 1
      - name: Tests
        env:
          PACKAGE: '@le-space/${{ inputs.package }}'
        run: pnpm --filter "$PACKAGE" run lint && pnpm --filter "$PACKAGE" run test
      - name: Pack
        env:
          PACKAGE: '@le-space/${{ inputs.package }}'
        run: pnpm --filter "$PACKAGE" pack --pack-destination "$RUNNER_TEMP/pack"
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: npm for trusted publishing
        run: npm install --global npm@11.6.2
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --access public
