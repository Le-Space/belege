name: Unit tests

# The app's lint (formatting, ESLint with the German guard), types, unit
# tests and production build. A workflow of its own, so the README can show
# its state (the badge is per workflow).

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ci.yml calls this for a release and a deploy.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release's run stays
  # apart from the push run; the prefix keeps the three test workflows apart.
  group: unit-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # What this pull request needs (scripts/ci-changes.mjs): a push to main, a
  # release (ci.yml) and a run by hand always run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.needs.outputs.unit }}
    steps:
      - uses: actions/checkout@v6
        with:
          # A pull request's checkout is its merge commit: HEAD^1 is the base.
          fetch-depth: 2
      - name: Which tests
        id: needs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > changed.txt
          else
            : > changed.txt
          fi
          node scripts/ci-changes.mjs "$EVENT" < changed.txt | tee -a "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The version comes from packageManager in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @belege/app lint
      - name: Types
        run: pnpm run check
      - name: Unit tests
        run: pnpm run test:unit
      # The Agent Skills under skills/ and the plugin manifests
      # (Le-Space/eigenbeleg-agent#29): format, hosts, no secret, no real data.
      - name: Skills
        run: pnpm run test:skills
      # A production build, as deploy.yml makes it: no test hooks. Once here,
      # not in every E2E shard (those build the app with VITE_E2E themselves).
      - name: Build
        run: pnpm run build
