name: Bridge tests

# The bridge's tests, with fakes only. The phase-0 spikes under spikes/ talk to
# a local Hibiscus, a mail server and an LLM API; they are not run here. A
# workflow of its own, so the README can show its state.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ci.yml calls this for a release and a deploy.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release's run stays
  # apart from the push run; the prefix keeps the three test workflows apart.
  group: bridge-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter @belege/bridge...
      # The portal tests drive a real headless Chromium against a fake portal.
      # Only the browser, no `--with-deps`: its apt-get is what hung (four
      # ten-minute hangs on 2026-10-22/23, then "Could not get lock" for every
      # retry, as a killed pnpm left apt-get holding the dpkg lock). The runner
      # image ships Google Chrome, so the libraries the headless shell needs are
      # there. Three tries of three minutes for the download itself.
      - name: Install Chromium for the portal tests
        timeout-minutes: 10
        run: |
          for try in 1 2 3; do
            timeout 180 pnpm --filter @belege/bridge exec playwright install --only-shell chromium && exit 0
            echo "Chromium download try $try did not finish; trying again"
          done
          exit 1
      - name: Format
        run: pnpm --filter @belege/bridge lint
      # release.yml's steps run only at a release: check their shell here.
      - name: Workflow shell syntax
        run: ruby scripts/check-workflow-shell.rb
      - name: Tests
        run: pnpm run test:bridge

  # The Credential Manager store (issue #205) cannot be tried on a Mac or on
  # Linux: a round trip through the real one, on Windows. The test needs no
  # dependency, so nothing is installed.
  windows-keychain:
    name: Windows Credential Manager
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - name: Round trip through the real Credential Manager
        run: node --test --test-reporter=spec bridge/test/windows-keychain.real.test.js

