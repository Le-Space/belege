name: CI

# Every gate at once, for release.yml and deploy.yml: the app's unit tests and
# browser specs and the bridge's tests. A push and a pull request run the three
# workflows themselves (unit.yml, e2e.yml, bridge.yml), each with its badge in
# the README; this one only gathers them for a caller.

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  unit:
    uses: ./.github/workflows/unit.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  bridge:
    uses: ./.github/workflows/bridge.yml
