name: CI

# The app and the bridge. The phase-0 spikes under spikes/ talk to a local
# Hibiscus, a mail server and an LLM API; they are not run here. The bridge
# tests and the app's specs use fakes only: a fake Hibiscus, a fake IMAP
# server (hoodiecrow) with a synthetic mailbox, a fake OpenAI-compatible API.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # deploy.yml runs the same gates before it publishes anything.
  workflow_call:

concurrency:
  # github.workflow keeps a run called from deploy.yml apart from the push run.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter @belege/bridge...
      - name: Format
        run: pnpm --filter @belege/bridge lint
      - name: Tests
        run: pnpm run test:bridge

  app:
    runs-on: ubuntu-latest
    # Same Playwright version as app/package.json, so the browsers are there.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # The Playwright image runs as root, and git refuses a checkout owned by
      # someone else without a word: `git log` then prints nothing and the
      # build stamp (commit and its time) is missing from the footer.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The version comes from packageManager in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @belege/app lint
      - name: Types
        run: pnpm run check
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build
        run: pnpm run build
      - name: Browser specs
        run: pnpm run test:e2e
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/test-results/
          retention-days: 7
