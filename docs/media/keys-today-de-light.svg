<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Schlüssel in Belege heute</title><desc>Ein Passkey liefert bei jedem Entsperren die Wurzel R; jeder Schlüssel wird daraus abgeleitet. Ein anderer Passkey liefert eine andere Wurzel und andere, leere Bücher.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="110" y="30" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="220.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Passkey</text><text x="220.0" y="69" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Gerät oder synchronisiert</text><rect x="390" y="30" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="490.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Anderer Passkey</text><text x="490.0" y="69" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">eigene PRF-Antwort</text><line x1="220" y1="86" x2="220" y2="124" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><line x1="490" y1="86" x2="490" y2="124" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="110" y="128" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="220.0" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Wurzel R = PRF-Antwort</text><text x="220.0" y="167" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">nur im Arbeitsspeicher</text><rect x="390" y="128" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="490.0" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Wurzel R′</text><text x="490.0" y="167" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">andere, leere Bücher</text><line x1="220" y1="184" x2="220" y2="222" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="226" width="600" height="154" rx="12" fill="none" stroke="#73726C" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Per HKDF abgeleitet, je ein eigenes Label</text><rect x="70" y="270" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="150.0" y="290.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Datenbankschlüssel</text><rect x="260" y="270" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="290.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Datenbanknamen</text><rect x="450" y="270" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="530.0" y="290.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Belegdatei-Schlüssel</text><rect x="70" y="324" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="150.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Sicherungsschlüssel</text><rect x="260" y="324" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Bücher-Identität</text><rect x="450" y="324" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="530.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Geräte-Nachweis</text></svg>
