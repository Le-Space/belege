<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Der Tresor der Bücher</title><desc>Jeder Passkey und die Wiederherstellungswörter öffnen ein eigenes Fach; in jedem liegt eine versiegelte Kopie desselben Tresorschlüssels, der die Wurzel R öffnet; jeder Schlüssel wird aus R abgeleitet.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="50" y="30" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="140.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Passkey A</text><text x="140.0" y="69" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">z. B. Laptop</text><rect x="250" y="30" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Passkey B</text><text x="340.0" y="69" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">z. B. Schlüssel im Safe</text><rect x="450" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="540.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Wiederherstellung</text><text x="540.0" y="69" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">24 Wörter auf Papier</text><line x1="140" y1="86" x2="140" y2="122" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><line x1="340" y1="86" x2="340" y2="122" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><line x1="540" y1="86" x2="540" y2="122" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="50" y="126" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="140.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Fach A</text><text x="140.0" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">versiegelte Kopie</text><rect x="250" y="126" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Fach B</text><text x="340.0" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">versiegelte Kopie</text><rect x="450" y="126" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="540.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Fach W</text><text x="540.0" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">versiegelte Kopie</text><line x1="140" y1="182" x2="300" y2="224" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><line x1="340" y1="182" x2="340" y2="224" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><line x1="540" y1="182" x2="380" y2="224" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="240" y="228" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="248" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Tresorschlüssel</text><text x="340.0" y="267" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">zufällig, 32 Byte</text><line x1="340" y1="284" x2="340" y2="318" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="190" y="322" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Wurzel R</text><text x="340.0" y="361" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">PRF-Antwort des ersten Passkeys</text><line x1="340" y1="378" x2="340" y2="410" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="414" width="600" height="116" rx="12" fill="none" stroke="#73726C" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="432" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Per HKDF abgeleitet, wie bisher</text><rect x="70" y="446" width="160" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="150.0" y="462.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Datenbankschlüssel</text><rect x="260" y="446" width="160" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="462.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Datenbanknamen</text><rect x="450" y="446" width="160" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="530.0" y="462.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Belegdatei-Schlüssel</text><rect x="70" y="486" width="160" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="150.0" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Sicherungsschlüssel</text><rect x="260" y="486" width="160" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Bücher-Identität</text><rect x="450" y="486" width="160" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="530.0" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">Geräte-Nachweis</text></svg>
