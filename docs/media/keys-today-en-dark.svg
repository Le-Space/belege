<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Keys in Belege today</title><desc>One passkey gives the root R at every unlock; every key is derived from it. Another passkey gives another root and other, empty books.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="110" y="30" width="220" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="1"/><text x="220.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#E1F5EE">Passkey</text><text x="220.0" y="69" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">on a device or synced</text><rect x="390" y="30" width="200" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="1"/><text x="490.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FAECE7">Another passkey</text><text x="490.0" y="69" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F5C4B3">its own PRF output</text><line x1="220" y1="86" x2="220" y2="124" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#a)"/><line x1="490" y1="86" x2="490" y2="124" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#a)"/><rect x="110" y="128" width="220" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/><text x="220.0" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#EEEDFE">Root R = PRF output</text><text x="220.0" y="167" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#CECBF6">in memory only</text><rect x="390" y="128" width="200" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="1"/><text x="490.0" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FAECE7">Root R′</text><text x="490.0" y="167" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F5C4B3">other, empty books</text><line x1="220" y1="184" x2="220" y2="222" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="226" width="600" height="154" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D3D1C7">Derived with HKDF, one label each</text><rect x="70" y="270" width="160" height="40" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="1"/><text x="150.0" y="290.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F1EFE8">Database key</text><rect x="260" y="270" width="160" height="40" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="290.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F1EFE8">Database names</text><rect x="450" y="270" width="160" height="40" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="1"/><text x="530.0" y="290.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F1EFE8">Receipt-file key</text><rect x="70" y="324" width="160" height="40" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="1"/><text x="150.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F1EFE8">Backup key</text><rect x="260" y="324" width="160" height="40" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F1EFE8">Books identity</text><rect x="450" y="324" width="160" height="40" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="1"/><text x="530.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F1EFE8">Device proof</text></svg>
