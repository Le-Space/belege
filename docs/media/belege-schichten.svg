<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>Belege-App: Wo das Geheimnis sitzt</title><desc>Passkey, HKDF und Datenschlüssel bleiben auf dem Gerät. Belegdateien und das OrbitDB-Log werden dort versiegelt und liegen als Blöcke in Helia. Über die Gerätegrenze geht nur Chiffretext: zu eigenen Geräten, zu eingeladenen Peers und, wenn eingeschaltet, als eine versiegelte Datei ins Backup in Alephs IPFS.</desc>
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333333"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E7B34"/></marker></defs>
<rect width="1600" height="800" fill="#FFFFFF"/>
<text x="800" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#222222">Belege-App: Wo das Geheimnis sitzt</text>
<text x="800" y="93" text-anchor="middle" font-size="20" fill="#666666">Alles links der Linie verlässt das Gerät nie. Rechts davon fließt nur Chiffretext.</text>
<rect x="80" y="133" width="933" height="587" rx="20" fill="#F8F8F8" stroke="#333333" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="107" y="171" text-anchor="start" font-size="19" font-weight="600" fill="#444444">Gerät des Nutzers (Browser-PWA)</text>
<line x1="1013" y1="133" x2="1013" y2="720" stroke="#C0392B" stroke-width="4"/>
<text x="1029" y="171" text-anchor="start" font-size="18" font-weight="600" fill="#C0392B">Gerätegrenze</text>
<rect x="133" y="213" width="240" height="93" rx="12" fill="#E8F0FE" stroke="#1D4ED8" stroke-width="2.5"/>
<text x="253.0" y="253.5" text-anchor="middle" font-size="21" font-weight="600" fill="#1E3A8A">Passkey</text>
<text x="253.0" y="282.5" text-anchor="middle" font-size="17" fill="#1E3A8A">WebAuthn PRF</text>
<rect x="443" y="213" width="173" height="93" rx="12" fill="#F2F2F2" stroke="#333333" stroke-width="2.5"/>
<text x="529.5" y="253.5" text-anchor="middle" font-size="21" font-weight="600" fill="#222222">HKDF</text>
<text x="529.5" y="282.5" text-anchor="middle" font-size="17" fill="#555555">Ableitung</text>
<rect x="685" y="213" width="267" height="93" rx="12" fill="#FFF4D6" stroke="#B7791F" stroke-width="2.5"/>
<text x="818.5" y="253.5" text-anchor="middle" font-size="21" font-weight="600" fill="#7A4B00">Datenschlüssel</text>
<text x="818.5" y="282.5" text-anchor="middle" font-size="17" fill="#7A4B00">existiert nirgends sonst</text>
<line x1="373" y1="260" x2="441" y2="260" stroke="#333333" stroke-width="2.5" marker-end="url(#k)"/>
<line x1="616" y1="260" x2="683" y2="260" stroke="#333333" stroke-width="2.5" marker-end="url(#k)"/>
<path d="M747 306V349H333V398" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#k)"/>
<text x="540" y="341" text-anchor="middle" font-size="17" fill="#7A4B00">verschlüsselt</text>
<line x1="818" y1="306" x2="818" y2="398" stroke="#B7791F" stroke-width="2.5" marker-end="url(#k)"/>
<text x="835" y="360" text-anchor="start" font-size="17" fill="#7A4B00">verschlüsselt</text>
<rect x="133" y="400" width="400" height="106" rx="12" fill="#F2F2F2" stroke="#333333" stroke-width="2.5"/>
<text x="333.0" y="434.0" text-anchor="middle" font-size="21" font-weight="600" fill="#222222">Belegdateien (PDF, Fotos)</text>
<text x="333.0" y="463.0" text-anchor="middle" font-size="17" fill="#555555">versiegelt, dann in IPFS-Blöcke geteilt</text>
<text x="333.0" y="488.0" text-anchor="middle" font-size="17" fill="#555555">verlassen das Gerät nur als Chiffretext</text>
<rect x="587" y="400" width="400" height="106" rx="12" fill="#E8F3E8" stroke="#1E7B34" stroke-width="2.5"/>
<text x="787.0" y="434.0" text-anchor="middle" font-size="21" font-weight="600" fill="#14532D">OrbitDB (append-only Log)</text>
<text x="787.0" y="463.0" text-anchor="middle" font-size="17" fill="#14532D">Metadaten, Zuordnung Beleg ↔ Zahlung</text>
<text x="787.0" y="488.0" text-anchor="middle" font-size="17" fill="#14532D">jeder Eintrag verschlüsselt + signiert</text>
<rect x="587" y="560" width="400" height="93" rx="12" fill="#E8F3E8" stroke="#1E7B34" stroke-width="2.5"/>
<text x="787.0" y="600.5" text-anchor="middle" font-size="21" font-weight="600" fill="#14532D">Helia (IPFS im Browser)</text>
<text x="787.0" y="629.5" text-anchor="middle" font-size="15.5" fill="#14532D">hält die versiegelten Blöcke · keine DHT-Ankündigung</text>
<line x1="787" y1="506" x2="787" y2="558" stroke="#333333" stroke-width="2.5" marker-end="url(#k)"/>
<path d="M333 506V606H585" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#k)"/>
<text x="459" y="596" text-anchor="middle" font-size="17" fill="#555555">Blöcke</text>
<rect x="1178" y="200" width="348" height="120" rx="12" fill="#FDECEC" stroke="#C0392B" stroke-width="2.5"/>
<text x="1352.0" y="241.0" text-anchor="middle" font-size="21" font-weight="600" fill="#8B1E1E">Was ein Außenstehender sieht</text>
<text x="1352.0" y="270.0" text-anchor="middle" font-size="17" fill="#8B1E1E">CIDs von Chiffretext-Blöcken –</text>
<text x="1352.0" y="295.0" text-anchor="middle" font-size="17" fill="#8B1E1E">ohne Schlüssel wertlos</text>
<rect x="1178" y="360" width="348" height="86" rx="12" fill="#FFFFFF" stroke="#1E7B34" stroke-width="2.5"/>
<text x="1352.0" y="397.0" text-anchor="middle" font-size="21" font-weight="600" fill="#14532D">Eigene weitere Geräte</text>
<text x="1352.0" y="426.0" text-anchor="middle" font-size="17" fill="#14532D">Handy, zweiter Rechner</text>
<rect x="1178" y="476" width="348" height="86" rx="12" fill="#FFFFFF" stroke="#1E7B34" stroke-width="2.5"/>
<text x="1352.0" y="513.0" text-anchor="middle" font-size="21" font-weight="600" fill="#14532D">Eingeladene Peers</text>
<text x="1352.0" y="542.0" text-anchor="middle" font-size="17" fill="#14532D">z. B. Steuerberater</text>
<rect x="1178" y="592" width="348" height="86" rx="12" fill="#FFFFFF" stroke="#1E7B34" stroke-width="2.5"/>
<text x="1352.0" y="629.0" text-anchor="middle" font-size="21" font-weight="600" fill="#14532D">Backup, wenn eingeschaltet</text>
<text x="1352.0" y="658.0" text-anchor="middle" font-size="17" fill="#14532D">eine versiegelte Datei in Alephs IPFS</text>
<path d="M989 606H1140V519" fill="none" stroke="#1E7B34" stroke-width="3" marker-start="url(#g)"/>
<path d="M1140 403V635" fill="none" stroke="#1E7B34" stroke-width="3"/>
<line x1="1140" y1="403" x2="1176" y2="403" stroke="#1E7B34" stroke-width="3" marker-end="url(#g)"/>
<line x1="1140" y1="519" x2="1176" y2="519" stroke="#1E7B34" stroke-width="3" marker-end="url(#g)"/>
<line x1="1140" y1="635" x2="1176" y2="635" stroke="#1E7B34" stroke-width="3" marker-end="url(#g)"/>
<rect x="1021" y="564" width="112" height="30" rx="8" fill="#FFFFFF" stroke="#1E7B34" stroke-width="2"/>
<text x="1077" y="584" text-anchor="middle" font-size="15" font-weight="600" fill="#14532D">Chiffretext</text>
<text x="800" y="773" text-anchor="middle" font-size="18" fill="#888888">Der Schlüssel verlässt das Gerät nie – wie ein SSH Private Key.</text>
</svg>
