<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Le Space Belege</title>
		<!-- Link previews (issue #343): what X/Twitter, LinkedIn and Telegram show
		     beside a link. Static, as their crawlers run no JavaScript; the texts are
		     the catalogue's `social` (a unit test keeps them equal), the image is
		     made by scripts/social-images.mjs. -->
		<meta name="description" content="Bank transactions and receipts matched automatically – encrypted in your own browser, no cloud account. With DATEV export, crypto wallets and receipts from your mailbox." />
		<link rel="canonical" href="https://belege.le-space.de/en/" />
		<link rel="alternate" hreflang="de" href="https://belege.le-space.de/" />
		<link rel="alternate" hreflang="en" href="https://belege.le-space.de/en/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Le Space Belege" />
		<meta property="og:title" content="Le Space Belege – payments and receipts, local in your browser" />
		<meta property="og:description" content="Bank transactions and receipts matched automatically – encrypted in your own browser, no cloud account. With DATEV export, crypto wallets and receipts from your mailbox." />
		<meta property="og:url" content="https://belege.le-space.de/en/" />
		<meta property="og:locale" content="en_GB" />
		<meta property="og:locale:alternate" content="de_DE" />
		<meta property="og:image" content="https://belege.le-space.de/social/belege-en.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Le Space Belege: payments and their receipts, matched and encrypted in your own browser" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Le Space Belege – payments and receipts, local in your browser" />
		<meta name="twitter:description" content="Bank transactions and receipts matched automatically – encrypted in your own browser, no cloud account. With DATEV export, crypto wallets and receipts from your mailbox." />
		<meta name="twitter:image" content="https://belege.le-space.de/social/belege-en.png" />
		<meta name="twitter:image:alt" content="Le Space Belege: payments and their receipts, matched and encrypted in your own browser" />
		<!-- The English entry (issue #343): a link to share in English. It opens
		     the app in English unless this browser already chose a language. -->
		<script>
			try {
				if (!localStorage.getItem('belege.locale')) localStorage.setItem('belege.locale', 'en');
			} catch (e) {}
			location.replace('../');
		</script>
	</head>
	<body>
		<p><a href="../">Le Space Belege</a></p>
	</body>
</html>
