<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Theme before paint (after Le-Space/simple-todo apps/escrow01): the
		     stored choice, else the system's. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('belege.theme');
					if (t !== 'light' && t !== 'dark') {
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.classList.toggle('dark', t === 'dark');
					document.documentElement.style.background = t === 'dark' ? '#0B0E15' : '#EDF1F8';
				} catch (e) {}
			})();
		</script>
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<!-- Installable (issue #141): the manifest, and the icon iOS asks for. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#0B0E15" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- Link previews (issue #343): what X/Twitter, LinkedIn and Telegram show
		     beside a link. Static, as their crawlers run no JavaScript; the texts are
		     the catalogue's `social` (a unit test keeps them equal), the image is
		     made by scripts/social-images.mjs. -->
		<meta
			name="description"
			content="Kontoumsätze und Belege automatisch zusammengeführt – verschlüsselt nur auf deinen eigenen Geräten, ohne Cloud-Konto. Mit DATEV-Export, Krypto-Wallets und Belegen aus dem Postfach."
		/>
		<link rel="canonical" href="https://belege.le-space.de/" />
		<link rel="alternate" hreflang="de" href="https://belege.le-space.de/" />
		<link rel="alternate" hreflang="en" href="https://belege.le-space.de/en/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Le Space Belege" />
		<meta
			property="og:title"
			content="Le Space Belege – Zahlungen und Belege, nur auf deinen eigenen Geräten"
		/>
		<meta
			property="og:description"
			content="Kontoumsätze und Belege automatisch zusammengeführt – verschlüsselt nur auf deinen eigenen Geräten, ohne Cloud-Konto. Mit DATEV-Export, Krypto-Wallets und Belegen aus dem Postfach."
		/>
		<meta property="og:url" content="https://belege.le-space.de/" />
		<meta property="og:locale" content="de_DE" />
		<meta property="og:locale:alternate" content="en_GB" />
		<meta property="og:image" content="https://belege.le-space.de/social/belege-de.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Le Space Belege: Zahlungen und ihre Belege, zusammengeführt und verschlüsselt nur auf deinen eigenen Geräten"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="Le Space Belege – Zahlungen und Belege, nur auf deinen eigenen Geräten"
		/>
		<meta
			name="twitter:description"
			content="Kontoumsätze und Belege automatisch zusammengeführt – verschlüsselt nur auf deinen eigenen Geräten, ohne Cloud-Konto. Mit DATEV-Export, Krypto-Wallets und Belegen aus dem Postfach."
		/>
		<meta name="twitter:image" content="https://belege.le-space.de/social/belege-de.png" />
		<meta
			name="twitter:image:alt"
			content="Le Space Belege: Zahlungen und ihre Belege, zusammengeführt und verschlüsselt nur auf deinen eigenen Geräten"
		/>
		<title>Le Space Belege</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
