# The launcher at Le Space, behind the host's Caddy on the shared `edge`
# network: Caddy proxies bridge-launcher.le-space.de to launcher:8790. No port
# is published on the host.
#
#   /opt/belege-launcher/launcher.env   BRIDGE_CONTRACT_ID, LAUNCHER_ACCOUNT_ID,
#                                       BRIDGE_IMAGE, LAUNCHER_ORIGINS, PHALA_API_KEY
#                                       (mode 600, root)
#   /opt/belege-launcher/near-key.json  the launcher account's near-cli credentials
#                                       (mode 400, owned by uid 10002)
services:
  launcher:
    image: belege-bridge-launcher:latest
    container_name: belege-launcher
    restart: unless-stopped
    env_file: /opt/belege-launcher/launcher.env
    environment:
      LAUNCHER_NEAR_KEY_FILE: /run/launcher/near-key.json
    volumes:
      - /opt/belege-launcher/near-key.json:/run/launcher/near-key.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    networks: [edge]

networks:
  edge:
    external: true
